<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Enclume et Braises</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky coin bar, one scrolling column, bottom tabs. Cold steel surfaces; the heat of metal (red to white-hot) is reserved for fire, progress and rarity. */
:root{
  --bg:#10141a; --panel:#18202a; --panel2:#212b37; --line:#2c3846;
  --fg:#e7e2d8; --mut:#8e9aa9; --ember:#ff8a3d; --on-ember:#1c0f05; --gold:#ecbf5a;
  --good:#72d19b; --bad:#ec6a5e;
  --h1:#6e1a10; --h2:#d8501a; --h3:#ffb23f; --h4:#fff0c4;
  --r0:#b3bcc7; --r1:#72d19b; --r2:#5fa8ff; --r3:#b98cff; --r4:#ffa63d;
  --font-d:"Cinzel",Georgia,serif; --font-b:"Alegreya Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.35 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
.mut{color:var(--mut)} .small{font-size:14px}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top .l0{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gps{font-size:14px;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l0 .gold{min-width:0}
.gold{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:32px;line-height:1.15;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c7,var(--gold) 45%,#9a6d1c);box-shadow:0 0 0 2px #5a3f0e inset;flex:none}
.l2{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:2px 0 6px}
.l2 .rk{font-family:var(--font-d);font-weight:600;color:var(--h3)}
.bar{position:relative;height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar.thin{height:4px}
.bar:not(.heat) i{display:block;height:100%;width:0;background:var(--ember);border-radius:inherit}
.bar.heat{background:linear-gradient(90deg,var(--h1),var(--h2) 45%,var(--h3) 80%,var(--h4))}
.bar.heat i{position:absolute;right:0;top:0;bottom:0;width:100%;background:var(--panel2)}

.ev{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--h2);font-size:15px}
.ev b{font-family:var(--font-d);color:var(--h3)}
.ev .bar{margin-top:6px}

.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mat{flex:none;display:flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.mat b{font-weight:700}

.quest{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.quest .qh{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-family:var(--font-d);font-weight:600}
.quest .qt{font-size:16px}
.quest .bar{grid-column:1/-1}

/* cards, buttons */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
h2{font:600 15px var(--font-d);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:22px 0 0}
.btn{border:0;border-radius:8px;background:var(--ember);color:var(--on-ember);font-weight:700;padding:10px 14px;min-height:44px;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.no{background:var(--panel2);color:var(--mut)}
.btn.ghost.no{border-color:var(--line);color:var(--mut)}
.btn:active{transform:translateY(1px)}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;background:var(--panel2);color:var(--mut);margin-left:8px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:2px 8px;border-radius:6px;background:var(--panel2);font-variant-numeric:tabular-nums}
.chip.lack{color:var(--bad)}

/* arena */
.arena{text-align:center}
.arena .nm{font-family:var(--font-d);font-weight:800;font-size:20px}
.arena .sub{color:var(--mut);font-size:14px}
#strike{display:block;margin:10px auto;width:176px;height:176px;border-radius:50%;border:0;padding:0;position:relative;background:radial-gradient(circle at 50% 45%,var(--panel2),var(--bg) 78%);user-select:none;-webkit-user-select:none}
#strike svg{width:78%;height:78%;margin:11%;pointer-events:none}
#strike.hit svg{animation:hit .16s ease-out}
@keyframes hit{0%{transform:scale(.9) rotate(-3deg)}100%{transform:none}}
.float{position:absolute;pointer-events:none;font-weight:700;font-size:18px;animation:rise .9s ease-out forwards;text-shadow:0 1px 0 #000;white-space:nowrap;z-index:2}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-56px)}}
.hpl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:0 0 4px;font-variant-numeric:tabular-nums}
.stats{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:15px;flex-wrap:wrap}
.stats b{font-variant-numeric:tabular-nums}

.zone{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.zone.sel{border-color:var(--ember)}
.zone.lock{border-style:dashed}
.zone .zi{width:52px;height:52px;border-radius:10px;background:var(--bg);padding:4px}
.zone .zi svg{width:100%;height:100%;display:block}
.zone b{font-family:var(--font-d);font-weight:600;font-size:16px}
.zone .zr{font-size:14px;text-align:right}
.zone .on{color:var(--ember);font-weight:700}
.price{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--ember);color:var(--on-ember);font-weight:700;font-variant-numeric:tabular-nums}
.price.no{background:var(--panel2);color:var(--mut)}

/* forge */
.anvil{width:100%;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;border:1px solid var(--h2);background:linear-gradient(180deg,var(--panel2),var(--panel));text-align:left;user-select:none;-webkit-user-select:none}
.anvil svg{width:84px;flex:none}
.anvil b{font-family:var(--font-d);font-size:20px;display:block}
.anvil span{color:var(--mut);font-size:14px}
.anvil.hit{animation:pulse .18s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,138,61,.55)}100%{box-shadow:0 0 0 14px rgba(255,138,61,0)}}
.slot{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.slot-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.slot-f{display:flex;gap:8px;margin-top:10px}
.tog,.lnk{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:14px;color:var(--mut);min-height:36px}
.tog.on{border-color:var(--ember);color:var(--ember)}
.rec{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;gap:4px}
.rec .btn{margin-top:8px}
.rec.locked{opacity:.55;border-style:dashed}
.rec b{font-family:var(--font-d);font-weight:600;font-size:16px}

/* shop */
.bulk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sale{display:grid;grid-template-columns:5px auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0;overflow:hidden}
.sale .rb{align-self:stretch;border-radius:0}
.sale b{font-weight:700}
.sale .ac{display:flex;gap:6px}
.sale .btn{padding:8px 10px;min-height:40px;font-size:15px}
.mk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.mk:last-child{border-bottom:0}
.mk .tone.up{color:var(--good)} .mk .tone.down{color:var(--bad)}

/* upgrades */
.up{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.up b{font-family:var(--font-d);font-weight:600;font-size:16px}
.up .lv{color:var(--mut);font-size:14px;margin-left:6px}
.up .btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:104px;font-variant-numeric:tabular-nums;padding:8px 10px}
.up .btn small{font-weight:500;font-size:13px}
.up .chip.lack{background:transparent}
.maxed{color:var(--good);font-weight:700}

.dyn{border-color:var(--r4)}
.dyn h3{font:800 20px var(--font-d);margin:0 0 4px;color:var(--r4)}
.fine{margin-top:26px;display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--mut);font-size:14px}

/* item icons, quantities, orders */
.ico{flex:none;width:46px;height:46px;border-radius:10px;background:var(--bg);border:2px solid var(--line);padding:3px;display:block}
.ico svg,.ib svg{width:100%;height:100%;display:block}
.ib{flex:none;width:26px;height:26px;display:block}
.ichip{flex:none;display:flex;align-items:center;gap:6px;padding:1px 10px 1px 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.ichip b{font-weight:700}
.rh,.sh{display:flex;align-items:center;gap:12px}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{border:1px solid var(--line);background:transparent;border-radius:8px;min-width:44px;min-height:40px;font-weight:700;color:var(--fg);padding:0 10px}
.qty button.on{border-color:var(--ember);color:var(--ember)}
.qty .qv{min-width:40px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.qty .sp{flex:1}
.ord{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
/* sound button */
.l0 .r{display:flex;align-items:center;gap:8px}
#snd,#mus{width:38px;height:36px;flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--fg);padding:0}
#snd.off,#mus.off{color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:8px;min-height:42px;font:600 13px var(--font-d);letter-spacing:.03em;color:var(--mut);padding:0 4px}
.seg button.on{border-color:var(--ember);color:var(--ember);background:var(--panel2)}
.oh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.oh>.mut,.oh>span{white-space:nowrap;flex:none}
.ol{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:10px}
.oc{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.oc.lack{color:var(--bad)}
.ocard{display:grid;gap:8px}
/* nav + toast */
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--panel);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav button{position:relative;border:0;background:transparent;padding:10px 2px;border-radius:8px;font:600 13px var(--font-d);letter-spacing:.04em;color:var(--mut);min-height:46px}
nav button[aria-current=true]{color:var(--ember);background:var(--panel2)}
.badge{position:absolute;top:2px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--ember);color:var(--on-ember);font:700 11px/18px var(--font-b);padding:0 5px}
.badge:empty{display:none}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(92vw,520px);background:var(--panel2);border:1px solid var(--ember);border-radius:10px;padding:10px 14px;z-index:40;opacity:0;pointer-events:none;transition:.2s;font-size:15px;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="l0"><div class="gold"><span class="coin"></span><span data-b="gold">0</span></div><span class="r"><span class="gps" data-b="gps"></span><button id="mus" type="button" aria-label="Musique" aria-pressed="true"></button><button id="snd" type="button" aria-label="Effets sonores" aria-pressed="true"></button></span></div>
    <div class="l2"><span class="rk" data-b="rank"></span><span class="mut" data-b="rankn"></span></div>
    <div class="bar thin"><i data-w="rank"></i></div>
    <div id="mats" class="strip"></div>
    <div id="items" class="strip" hidden></div>
  </header>

  <div id="ev" class="ev" hidden><b id="evN"></b> <span id="evD"></span><div class="bar thin"><i data-w="ev"></i></div></div>

  <div id="quest" class="quest">
    <div><div class="qh">Objectif</div><div class="qt" id="qT"></div></div>
    <button id="qB" class="btn" type="button" data-a="claim" hidden></button>
    <div class="bar thin"><i data-w="q"></i></div>
  </div>

  <!-- Récolte -->
  <section id="tab-mine" aria-label="Récolte">
    <div class="card arena" style="margin-top:12px">
      <div class="nm" id="zNode"></div>
      <div class="sub" id="zWhere"></div>
      <button id="strike" type="button" aria-label="Frapper"></button>
      <div class="hpl"><span id="zHint"></span><span data-b="zhp"></span></div>
      <div class="bar"><i data-w="hp"></i></div>
      <div class="stats">
        <span>Tes coups <b data-b="tapd"></b></span>
        <span>Compagnie <b data-b="dpsv"></b> /s</span>
      </div>
    </div>
    <h2>Terres à explorer</h2>
    <div id="zones" class="stack"></div>
  </section>

  <!-- Forge -->
  <section id="tab-forge" aria-label="Forge" hidden>
    <div class="stack">
      <button id="hammer" class="anvil" type="button">
        <svg viewBox="0 0 120 70" aria-hidden="true"><path d="M6 12h88c8 0 15-3 20-9 0 15-9 26-24 28H74l6 14h10v15H34V45h10l6-14H34C20 31 8 25 6 12Z" fill="#2f3b4a"/><path d="M6 10h88v5H6Z" style="fill:var(--h3)"/><path d="M34 60h56v-4H34Z" fill="#3b4859"/></svg>
        <div><b>Marteler</b><span>Chaque coup fait avancer toutes les forges.</span></div>
      </button>
    </div>
    <h2>Enclumes</h2>
    <div id="slots" class="stack"></div>
    <h2>File de fabrication</h2>
    <div id="orders" class="stack"></div>
    <h2>Plans</h2>
    <div id="recs" class="stack"></div>
  </section>

  <!-- Boutique -->
  <section id="tab-shop" aria-label="Boutique" hidden>
    <div id="shopNav" class="seg"></div>
    <div id="v-sales">
      <div id="shopTop" class="stack"></div>
      <h2>Comptoir</h2>
      <div id="sales" class="stack"></div>
      <h2>Prix du marché</h2>
      <div id="market" class="card" style="margin-top:10px;padding:4px 14px"></div>
    </div>
    <div id="v-orders" hidden><div id="ordersV"></div></div>
    <div id="v-contracts" hidden><div id="contractsV"></div></div>
  </section>

  <!-- Améliorations -->
  <section id="tab-up" aria-label="Améliorations" hidden><div id="ups"></div></section>

  <!-- Empire -->
  <section id="tab-emp" aria-label="Empire" hidden><div id="emp"></div></section>
</div>

<nav><div id="nav">
  <button type="button" data-a="tab" data-id="mine" aria-current="true">Récolte</button>
  <button type="button" data-a="tab" data-id="forge" aria-current="false">Forge</button>
  <button type="button" data-a="tab" data-id="shop" aria-current="false">Boutique<span class="badge" data-b="stkn"></span></button>
  <button type="button" data-a="tab" data-id="up" aria-current="false">Progrès</button>
  <button type="button" data-a="tab" data-id="emp" aria-current="false">Empire</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const SAVE_KEY='enclume-braises-v1';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ---------- formats ---------- */
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<1000) return String(Math.floor(n));
  const u=[' k',' M',' Md',' Bn',' Bd',' Tn']; let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):n.toFixed(0)).replace('.',',')+u[i];
}
function fmtd(n){
  if(n>=1000) return fmt(n);
  if(n>=100) return String(Math.round(n));
  return (Math.round(n*10)/10).toString().replace('.',',');
}
function fmtT(s){ s=Math.max(0,Math.ceil(s)); if(s>=3600) return Math.floor(s/3600)+' h '+String(Math.floor(s%3600/60)).padStart(2,'0'); if(s>=60) return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'; return s+' s'; }

/* ---------- data ---------- */
const MATS={
  fer:{n:'Fer',c:'#a9b6c4'}, charbon:{n:'Charbon',c:'#7d8796'}, cuir:{n:'Cuir',c:'#c98c57'},
  argent:{n:'Argent',c:'#dfe9f2'}, os:{n:'Os',c:'#e9dfc6'}, gemme:{n:'Gemmes',c:'#d778e0'},
  mithril:{n:'Mithril',c:'#5ad1d9'}, ecaille:{n:'Écailles',c:'#e5584a'}
};
const MATORDER=['fer','charbon','cuir','argent','os','gemme','mithril','ecaille'];
const ZONES=[
 {id:'z1',n:'Mine de Brumeroc',node:'Veine de fer',k:'m',art:'mine',c:'#c27a4d',hp:8,cost:0,bounty:0,loot:[{m:'fer',a:2,b:4,p:1},{m:'charbon',a:1,b:2,p:.5}]},
 {id:'z2',n:'Tanière des gobelins',node:'Gobelin pillard',k:'o',art:'gob',c:'#79b564',hp:28,cost:60,bounty:4,loot:[{m:'cuir',a:1,b:3,p:1},{m:'fer',a:1,b:2,p:.6}]},
 {id:'z3',n:'Filons de Valcreux',node:'Veine d’argent',k:'m',art:'mine',c:'#e4edf5',hp:90,cost:400,bounty:0,loot:[{m:'argent',a:1,b:3,p:1},{m:'fer',a:1,b:3,p:.7},{m:'charbon',a:1,b:2,p:.6}]},
 {id:'z4',n:'Crypte des damnés',node:'Squelette ancien',k:'o',art:'skull',c:'#e8dec4',hp:300,cost:2800,bounty:30,loot:[{m:'os',a:2,b:4,p:1},{m:'argent',a:1,b:2,p:.5}]},
 {id:'z5',n:'Gouffre de mithril',node:'Cristal de mithril',k:'m',art:'crystal',c:'#5ad1d9',hp:900,cost:22000,bounty:0,loot:[{m:'mithril',a:1,b:2,p:1},{m:'gemme',a:1,b:2,p:.7}]},
 {id:'z6',n:'Repaire du dragon rouge',node:'Dragon rouge',k:'o',art:'dragon',c:'#dd5646',hp:4000,cost:170000,bounty:500,loot:[{m:'ecaille',a:1,b:3,p:1},{m:'mithril',a:1,b:2,p:.6},{m:'gemme',a:1,b:2,p:.5}]}

function ensureCtx(){
  if(!SND.ctx){
    try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      const c=new C(),g=c.createGain(),comp=c.createDynamicsCompressor(); g.gain.value=.55; g.connect(comp); comp.connect(c.destination); SND.ctx=c; SND.out=g; }catch(e){ return null; }
  }
  if(SND.ctx.state==='suspended'){ try{ SND.ctx.resume(); }catch(e){} }
  return SND.ctx;
}
function actx(){ return SND.on?ensureCtx():null; }
let NB=null;
function nbuf(c){ if(!NB){ const n=c.sampleRate; NB=c.createBuffer(1,n,c.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; } return NB; }
function tn(c,f,t,dur,vol,type,f2,dest){
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(vol,.0002),t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest||SND.out); o.start(t); o.stop(t+dur+.03);
}
function nz(c,t,dur,vol,freq,q,type){
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(); s.buffer=nbuf(c); fl.type=type; fl.frequency.value=freq; fl.Q.value=q;
  g.gain.setValueAtTime(Math.max(vol,.0002),t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl); fl.connect(g); g.connect(SND.out); s.start(t); s.stop(t+dur+.03);
}

  hit(c,t,v){ const j=jit(); tn(c,150*j,t,.16,.55*v,'sine',55); nz(c,t,.1,.5*v,700,.8,'lowpass'); nz(c,t+.01,.05,.25*v,3500,.7,'highpass'); },
  kill(c,t,v,k){
    if(k==='m'){ nz(c,t,.25,.5*v,1200,.6,'lowpass'); [1200,1600,2100].forEach((f,i)=>tn(c,f*jit(),t+.03*i,.12,.12*v,'triangle')); }
    else { tn(c,320,t,.35,.35*v,'sawtooth',70); nz(c,t,.2,.3*v,500,.7,'lowpass'); }
  },

    [[620,.5,.6],[1530,.32,.42],[2570,.22,.3],[3900,.12,.2]].forEach(a=>tn(c,a[0],t,a[2],a[1]*.5*v,'sine')); },
  done(c,t,v,r){ const n=[784,988,1175,1568,2093]; for(let i=0;i<=Math.min(r||0,4);i++){ tn(c,n[i],t+i*.07,.32,.16*v,'sine'); tn(c,n[i]*2,t+i*.07,.2,.05*v,'triangle'); } },
  coin(c,t,v){ tn(c,1568,t,.08,.2*v,'triangle'); tn(c,2349,t+.07,.24,.2*v,'triangle'); nz(c,t,.03,.12*v,6000,.7,'highpass'); },
  buy(c,t,v){ tn(c,523,t,.12,.2*v,'triangle'); tn(c,784,t+.09,.2,.22*v,'triangle'); tn(c,1047,t+.18,.3,.2*v,'triangle'); },
  horn(c,t,v){ tn(c,196,t,.6,.12*v,'sawtooth'); tn(c,294,t,.6,.08*v,'sawtooth'); },
  bell(c,t,v){ tn(c,1319,t,.7,.16*v,'sine'); tn(c,1976,t,.5,.08*v,'sine'); tn(c,2637,t+.01,.3,.04*v,'sine'); }
};
const MINGAP={pick:35,hit:35,kill:60,auto:300,clang:50,done:100,coin:80,buy:100,horn:1000,bell:500};
function snd(name,x){
  if(!SND.on||document.hidden) return;
  const now=performance.now(); if(now-(SND.last[name]||-1e9)<(MINGAP[name]||0)) return; SND.last[name]=now;
  const c=actx(); if(!c) return; const t=c.currentTime+.005;
  try{
    switch(name){
      case 'pick':SFX.pick(c,t,1);break;
      case 'hit':SFX.hit(c,t,1);break;
      case 'auto':(x==='m'?SFX.pick:SFX.hit)(c,t,.35);break;
      case 'kill':SFX.kill(c,t,1,x);break;
      case 'clang':SFX.clang(c,t,1);break;
      case 'done':SFX.done(c,t,1,x);break;
      case 'coin':SFX.coin(c,t,typeof x==='number'?x:1);break;
      case 'buy':SFX.buy(c,t,1);break;
      case 'horn':SFX.horn(c,t,1);break;
      case 'bell':SFX.bell(c,t,1);break;
    }
  }catch(e){}
}

/* ---------- music (generated: D dorian, lute, flute, drone, soft drum) ---------- */
const MUS={on:true,run:false,timer:null,next:0,step:0,bus:null,drone:[],cur:null,last:-1};
try{ if(localStorage.getItem('eb-mus')==='0') MUS.on=false; }catch(e){}
const SCALE=[62,64,65,67,69,71,72,74,76,77];
const CHORDS=[[50,57,62],[48,55,60],[50,57,62],[45,52,57]];
const PHR=[
 [4,-1,5,4,2,-1,3,2, 0,-1,2,-1,4,-1,-1,-1],
 [7,-1,6,5,4,-1,5,4, 2,-1,3,2,0,-1,-1,-1],
 [0,2,4,-1,5,-1,4,2, 3,-1,2,0,2,-1,-1,-1],
 [4,5,7,-1,6,-1,5,4, 5,-1,4,2,0,-1,-1,-1],
 [2,-1,4,-1,5,-1,7,-1, 6,-1,4,-1,2,0,2,-1]
];
const mf=n=>440*Math.pow(2,(n-69)/12);
function impulse(c){ const n=Math.floor(c.sampleRate*2.2),b=c.createBuffer(2,n,c.sampleRate); for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5); } return b; }
function pluck(c,f,t,vol,dur){ tn(c,f,t,dur,vol,'triangle',0,MUS.bus); tn(c,f*2,t,dur*.4,vol*.3,'sine',0,MUS.bus); }
function flute(c,f,t,dur,vol){
  const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
  o.type='sine'; o.frequency.value=f; l.frequency.value=5; lg.gain.value=f*.006; l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.07); g.gain.setValueAtTime(vol,t+dur*.6); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(MUS.bus); o.start(t); l.start(t); o.stop(t+dur+.03); l.stop(t+dur+.03);
  tn(c,f*2,t,dur*.7,vol*.12,'sine',0,MUS.bus);
}
function musStep(c,t,st){
  const bar=Math.floor(st/8),pos=st%8,ch=CHORDS[bar%4];
  const ai=[0,1,2,1,0,1,2,1][pos];
  pluck(c,mf(ch[ai]),t,pos===0?.085:.05,1.1);
  if(pos===0||pos===4) tn(c,95,t,.22,.12,'sine',52,MUS.bus);
  if(pos===2||pos===6) nz(c,t,.05,.03,5000,.8,'highpass');
  const ip=st%16;
  if(ip===0){ let k=Math.floor(Math.random()*(PHR.length+1)); if(k===MUS.last) k=(k+1)%(PHR.length+1); MUS.last=k; MUS.cur=k<PHR.length?PHR[k]:null; MUS.fl=Math.random()<.45; }
  if(MUS.cur){ const d=MUS.cur[ip]; if(d>=0){ const f=mf(SCALE[d]); if(MUS.fl) flute(c,f,t,.5,.07); else pluck(c,f,t,.12,1.0); } }
}
function musTick(){
  const c=SND.ctx; if(!c||!MUS.run) return; const SD=60/84/2;
  let g=0; while(MUS.next<c.currentTime+.5&&g++<8){ musStep(c,MUS.next,MUS.step); MUS.next+=SD; MUS.step++; }
}
function startMusic(){
  if(!MUS.on||MUS.run) return; const c=ensureCtx(); if(!c) return;
  MUS.run=true;
  if(!MUS.bus||MUS.busCtx!==c){
    const bus=c.createGain(),conv=c.createConvolver(),wet=c.createGain(); bus.gain.value=0; conv.buffer=impulse(c); wet.gain.value=.5;
    bus.connect(SND.out); bus.connect(conv); conv.connect(wet); wet.connect(SND.out); MUS.bus=bus; MUS.busCtx=c;
  }
  MUS.bus.gain.cancelScheduledValues(c.currentTime); MUS.bus.gain.setTargetAtTime(.5,c.currentTime,.8);
  MUS.drone=[[73.42,.05],[110,.035],[146.83,.016]].map(a=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=a[0]; g.gain.value=a[1]; o.connect(g); g.connect(MUS.bus); o.start(); return o; });
  MUS.next=c.currentTime+.25; MUS.step=0;
  MUS.timer=setInterval(musTick,150);
}
function stopMusic(){
  if(!MUS.run) return; MUS.run=false; clearInterval(MUS.timer);
  const c=SND.ctx; if(c&&MUS.bus){ MUS.bus.gain.cancelScheduledValues(c.currentTime); MUS.bus.gain.setTargetAtTime(0,c.currentTime,.25); }
  const d=MUS.drone; MUS.drone=[]; setTimeout(()=>d.forEach(o=>{ try{o.stop();}catch(e){} }),1500);
}

/* ---------- state ---------- */
function fresh(){return{gold:0,run:0,life:0,legacy:0,mats:{},zone:'z1',zu:{z1:1},hp:ZONES[0].hp,
  slots:[{r:null,p:0,on:false}],orders:[],qsel:{},cmd:[],con:{},rep:0,uid:0,nextCmd:45,nextLord:360,stock:{},dem:{},trend:{},up:{},ev:null,evT:0,nextEv:90,trT:30,sellAcc:0,q:0,
  st:{col:{},crafted:0,sold:0,bestR:0},t:Date.now()};}
let S=fresh();
let QUIET=false;
const lvl=id=>S.up[id]||0;

function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){ const o=JSON.parse(raw); S=Object.assign(fresh(),o); S.st=Object.assign(fresh().st,o.st||{}); S.st.col=S.st.col||{}; if(!ZMAP[S.zone]) S.zone='z1'; }
  }catch(e){}
}
function save(){ try{ S.t=Date.now(); localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- derived values ---------- */
const legM=()=>1+.1*S.legacy;
const tapDmg=()=>(1+lvl('pick')+6*lvl('ham')+40*lvl('mpick')+300*lvl('dblade'))*legM();
const dps=()=>CMP.reduce((s,id,i)=>s+lvl(id)*CMPD[i],0)*legM();
const gps=()=>EMP.reduce((s,id,i)=>s+lvl(id)*EMPG[i],0)*legM();
const speed=()=>1+.15*lvl('bellows');
const matQ=q=>Math.max(1,Math.ceil(q*(1-.04*lvl('alloy'))));
const priceMult=()=>(1+.08*lvl('sign'))*legM();
function upCost(u){const l=lvl(u.id);return Math.ceil(u.base*Math.pow(u.g,l));}
function upMat(u){const l=lvl(u.id);return u.mat?Math.ceil(u.mat.b*Math.pow(u.mat.g,l)):0;}
function costOf(it){const o={};for(const m in it.m)o[m]=matQ(it.m[m]);return o;}
function recipeOpen(it){return Object.keys(it.m).every(m=>S.zu[MATZONE[m]]);}
function hasMats(c){return Object.keys(c).every(m=>(S.mats[m]||0)>=c[m]);}
function rankInfo(){let i=0;for(let k=0;k<RANKS.length;k++)if(S.life>=RANKS[k][0])i=k;const nx=RANKS[i+1];return{name:RANKS[i][1],next:nx?nx[0]:0,f:nx?(S.life-RANKS[i][0])/(nx[0]-RANKS[i][0]):1};}
const legGain=()=>Math.floor(Math.sqrt(S.run/1e6));
function ensureSlots(){const n=1+lvl('anvil');while(S.slots.length<n)S.slots.push({r:null,p:0,on:false,rep:true});}

/* ---------- core actions ---------- */
function gain(g){S.gold+=g;S.run+=g;S.life+=g;}
function addMat(id,q){S.mats[id]=(S.mats[id]||0)+q;S.st.col[id]=(S.st.col[id]||0)+q;}
function killZone(z,vis){
  const evl=S.ev&&EV[S.ev].loot?EV[S.ev].loot:1;
  const dbl=Math.random()<.05*lvl('bag')?2:1;
  for(const l of z.loot){ if(Math.random()<l.p){ const q=rnd(l.a,l.b)*dbl*evl; addMat(l.m,q); if(vis) float('+'+q+' '+MATS[l.m].n,MATS[l.m].c); } }
  if(z.bounty){ const g=z.bounty*legM(); gain(g); if(vis) float('+'+fmt(g)+' or','var(--gold)'); }
}
function strike(e){
  const z=ZMAP[S.zone]; S.hp-=tapDmg();
  const art=$('#strike'); art.classList.remove('hit'); void art.offsetWidth; art.classList.add('hit');
  float(fmtd(tapDmg()),'var(--fg)',e);
  snd(z.k==='m'?'pick':'hit');
  if(S.hp<=0){ killZone(z,true); S.hp=z.hp; snd('kill',z.k); }
}
function float(txt,color,e){
  const box=$('#strike'); if(box.querySelectorAll('.float').length>10) return;
  const r=box.getBoundingClientRect(); const d=document.createElement('div'); d.className='float'; d.textContent=txt; d.style.color=color;
  let x=r.width/2+(Math.random()*50-25), y=r.height/2-8+(Math.random()*30-15);
  if(e&&e.clientX!==undefined&&e.clientX!==0){ x=e.clientX-r.left; y=e.clientY-r.top-20; }
  d.style.left=x+'px'; d.style.top=y+'px'; box.appendChild(d); d.addEventListener('animationend',()=>d.remove());
}
function toast(m){ if(QUIET) return; const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2600); }

/* forge */
function startSlot(s,id){
  const it=IMAP[id||s.r]; if(!it) return false; const c=costOf(it);
  if(!hasMats(c)) return false;
  for(const m in c) S.mats[m]-=c[m];
  s.r=it.id; s.p=0; s.on=true; return true;
}
function rollR(){
  const m=lvl('mastery')+.5*S.legacy; const w=[100,10+4*m,1.5+2*m,.15+.8*m,.01+.2*m];
  let t=w.reduce((a,b)=>a+b,0)*Math.random();
  for(let i=0;i<5;i++){ t-=w[i]; if(t<=0) return i; } return 0;
}
function finish(s,it){
  const r=rollR(); const k=it.id+'|'+r; S.stock[k]=(S.stock[k]||0)+1;
  S.st.crafted++; if(r>S.st.bestR) S.st.bestR=r;
  s.on=false; s.p=0;
  if(!QUIET) snd('done',r);
  if(r>=2) toast(RAR[r].n+' : '+it.n+' forgé(e) !');
}
function nextOrder(){for(let i=0;i<S.orders.length;i++){if(hasMats(costOf(IMAP[S.orders[i].id])))return i;}return -1;}
function startFromOrder(s){
  const i=nextOrder(); if(i<0) return false;
  const o=S.orders[i]; startSlot(s,o.id);
  if(o.n>0){ o.n--; if(o.n===0) S.orders.splice(i,1); }
  return true;
}
function simSlots(dt){
  const sp=speed();
  for(const s of S.slots){
    let rem=dt,g=0;
    while(g++<400){
      if(!s.on){ if(!startFromOrder(s)) break; }
      const it=IMAP[s.r]; const need=Math.max(0,it.t-s.p); const adv=rem*sp;
      if(adv>=need){ rem-=need/sp; finish(s,it); } else { s.p+=adv; break; }
    }
  }
}
function addOrder(id){
  const q=S.qsel[id]||1,it=IMAP[id],o=S.orders.find(x=>x.id===id);
  if(o) o.n=(q<0||o.n<0)?-1:o.n+q; else S.orders.push({id,n:q});
  simSlots(0);
  toast((q<0?'En continu : ':'× '+q+' : ')+it.n+(hasMats(costOf(it))?'':' (il manque des matériaux)'));
}
function hammer(){
  const b=$('#hammer'); b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit');
  snd('clang');
  for(const s of S.slots) if(s.on) s.p+=.4;
}

/* selling */
const getDem=id=>S.dem[id]??S.trend[id]??1;
function evMult(it){ if(!S.ev) return 1; const e=EV[S.ev]; if(!e.cat) return 1; return (e.cat==='*'||e.cat===it.cat)?e.m:1; }
function unitPrice(id,r){const it=IMAP[id];return it.p*RAR[r].m*getDem(id)*evMult(it)*priceMult();}
function sellOne(k){
  if(!S.stock[k]) return 0; const [id,r]=k.split('|'); const p=unitPrice(id,+r);
  gain(p); S.stock[k]--; if(!S.stock[k]) delete S.stock[k];
  S.dem[id]=Math.max(.35,getDem(id)*.975); S.st.sold++; return p;
}
function bestKey(){let b=null,bp=-1;for(const k in S.stock){const [id,r]=k.split('|');const p=unitPrice(id,+r);if(p>bp){bp=p;b=k;}}return b;}
function sellAll(filter){let tot=0,n=0;for(const k of Object.keys(S.stock)){if(filter&&!filter(k))continue;const c=S.stock[k];for(let i=0;i<c;i++){tot+=sellOne(k);n++;}}return[tot,n];}
const stockCount=()=>Object.values(S.stock).reduce((a,b)=>a+b,0);

/* ---------- simulation ---------- */
function sim(dt){
  const z=ZMAP[S.zone],d=dps();
  if(d>0){ S.hp-=d*dt; let k=0; const vis=!QUIET&&dt<=1; while(S.hp<=0&&k<3000){ killZone(z,vis&&k<2); S.hp+=z.hp; k++; } if(S.hp<=0) S.hp=z.hp; if(k>0&&!QUIET) snd('auto',z.k); }
  const g=gps(); if(g>0) gain(g*dt);
  simSlots(dt);
  const c=lvl('clerk');
  if(c>0){ S.sellAcc+=c*dt/5; let k=0,sold=0; while(S.sellAcc>=1&&k++<800){ S.sellAcc-=1; const b=bestKey(); if(!b){S.sellAcc=0;break;} sellOne(b); sold++; } if(sold&&!QUIET) snd('coin',.45); }
  simContracts(dt); simCmd(dt);
  const rate=.012*(1+.25*lvl('haggle')),kk=1-Math.exp(-rate*dt);
  for(const id in S.dem) S.dem[id]+=((S.trend[id]??1)-S.dem[id])*kk;
  S.trT-=dt; if(S.trT<=0){ S.trT=rnd(25,50); S.trend[ITEMS[rnd(0,ITEMS.length-1)].id]=.85+Math.random()*.4; }
  if(S.ev){ S.evT-=dt; if(S.evT<=0){ S.ev=null; S.nextEv=rnd(80,150); } }
  else { S.nextEv-=dt; if(S.nextEv<=0){ const ids=Object.keys(EV); S.ev=ids[rnd(0,ids.length-1)]; S.evT=60; if(!QUIET) snd('horn'); toast(EV[S.ev].n+' : '+EV[S.ev].d); } }
}
function advance(dt){
  const big=dt>5; const g0=S.gold,c0=S.st.crafted;
  if(big) QUIET=true;
  const n=Math.min(600,Math.max(1,Math.ceil(dt/10))),st=dt/n;
  for(let i=0;i<n;i++) sim(st);
  QUIET=false;
  if(dt>60){ const dg=S.gold-g0,dc=S.st.crafted-c0; toast('Pendant ton absence ('+fmtT(dt)+') : +'+fmt(dg)+' or, '+dc+' objet'+(dc>1?'s':'')+' forgé'+(dc>1?'s':'')+'.'); }
}

/* ---------- special orders and army contracts ---------- */
const stockOf=(id,minR)=>{let n=0;for(let r=minR||0;r<5;r++)n+=S.stock[id+'|'+r]||0;return n;};
const canDeliver=o=>o.lines.every(l=>stockOf(l.id,l.r)>=l.n);
function takeItems(id,minR,n){for(let r=minR;r<5&&n>0;r++){const k=id+'|'+r,c=S.stock[k]||0,t=Math.min(c,n);if(t){S.stock[k]-=t;if(!S.stock[k])delete S.stock[k];n-=t;}}}
function mkOrder(lord){
  const open=ITEMS.filter(recipeOpen); if(open.length<(lord?3:1)) return null;
  const uid=++S.uid; const lines=[]; let who,role,quote,mult,tmax;
  if(lord){
    const pool=open.slice(),n=Math.min(pool.length,rnd(2,3));
    for(let i=0;i<n;i++){ const it=pool.splice(rnd(0,pool.length-1),1)[0]; lines.push({id:it.id,n:rnd(2,4),r:1}); }
    who='Le seigneur de Brumeroc'; role='Seigneur'; quote='Pour la défense de mes terres. Ne me déçois pas.'; mult=2.2; tmax=600;
  } else {
    const w=WHO[rnd(0,WHO.length-1)],idx=Math.floor((1-Math.pow(Math.random(),1.6))*open.length),it=open[Math.min(idx,open.length-1)],x=Math.random();
    const r=x<.6?0:x<.9?1:(lvl('mastery')>=8&&x>.96?3:(lvl('mastery')>=4?2:1));
    lines.push({id:it.id,n:rnd(1,3),r}); who=w.names[rnd(0,w.names.length-1)]; role=w.role; quote=w.q; mult=1.5+Math.random()*.8; tmax=rnd(240,420);
  }
  let gold=0,rp=0;
  for(const l of lines){ const it=IMAP[l.id]; gold+=it.p*RAR[l.r].m*l.n*mult; rp+=1+Math.floor(ITEMS.indexOf(it)/3); }
  return {uid,who,role,quote,lines,lord:!!lord,gold:Math.round(gold*priceMult()),rep:lord?rp+3:rp,t:tmax,tmax};
}
function simCmd(dt){
  if(S.st.crafted<2) return;
  if(!QUIET){ for(const o of S.cmd) o.t-=dt; const gone=S.cmd.filter(o=>o.t<=0); if(gone.length){ S.cmd=S.cmd.filter(o=>o.t>0); toast(gone[0].who+' est reparti sans attendre.'); } }
  S.nextCmd-=dt;
  if(S.nextCmd<=0&&S.cmd.filter(o=>!o.lord).length<3){ const o=mkOrder(false); if(o){ S.cmd.push(o); S.nextCmd=rnd(50,100); toast('Nouvelle commande : '+o.who+'.'); if(!QUIET) snd('bell'); } }
  S.nextLord-=dt;
  if(S.nextLord<=0&&!S.cmd.some(o=>o.lord)){ const o=mkOrder(true); if(o){ S.cmd.push(o); S.nextLord=rnd(300,480); toast('Le seigneur de Brumeroc passe commande !'); if(!QUIET) snd('bell'); } }
}
function simContracts(dt){
  for(const k of CONTR){
    const c=S.con[k.id]; if(!c||!c.on) continue;
    c.t=Math.min(k.every,(c.t||0)+dt); if(c.t<k.every) continue;
    const it=IMAP[k.item]; let left=k.q,earn=0;
    for(let r=0;r<5&&left>0;r++){ const key=k.item+'|'+r,n=Math.min(S.stock[key]||0,left); if(n){ earn+=n*it.p*RAR[r].m*k.mult*priceMult(); S.stock[key]-=n; if(!S.stock[key]) delete S.stock[key]; left-=n; } }
    if(left<k.q){ gain(earn); c.g=(c.g||0)+earn; S.st.sold+=k.q-left; c.t=0; if(!QUIET) snd('coin',.5); }
  }
}

/* ---------- ui helpers ---------- */
function setHTML(el,h){ if(el._h!==h){ el._h=h; el.innerHTML=h; } }
let TAB='mine',lastZone=null,confP=false,confR=false,SHOPV='sales';
const chip=(m,q)=>`<span class="chip" data-need="${m}:${q}"><i class="sw" style="background:${MATS[m].c}"></i><span data-b="mat:${m}"></span>/${fmt(q)} ${MATS[m].n}</span>`;

function renderMats(){

function renderArena(){

function renderZones(){

function upRow(u){

  return `<div class="up"><div><b>${u.n}</b><span class="lv">${u.max?`niv. ${l}/${u.max}`:`× ${l}`}</span></div>${btn}<div class="mut small" style="grid-column:1/-1">${u.d}</div></div>`;
}

/* ---------- bindings ---------- */
function split(k){const i=k.indexOf(':');return i<0?[k,'']:[k.slice(0,i),k.slice(i+1)];}
function bval(k){
  const [t,a]=split(k);
  switch(t){
    case 'gold':return fmt(S.gold);
    case 'gps':return gps()>0?'+'+fmtd(gps())+' or/s':'';
    case 'gpsv':return '+'+fmtd(gps())+' or/s';
    case 'rank':return rankInfo().name;
    case 'rankn':{const r=rankInfo();return r.next?'Prochain titre à '+fmt(r.next):'Titre suprême';}
    case 'mat':return fmt(S.mats[a]||0);
    case 'stk':return '× '+(S.stock[a]||0);
    case 'stkn':{const n=stockCount();return n?String(n>99?'99+':n):'';}
    case 'pr':{const [id,r]=a.split('|');return fmt(unitPrice(id,+r));}
    case 'mk':{const it=IMAP[a];return Math.round(getDem(a)*evMult(it)*100)+' %';}
    case 'rep':return fmt(S.rep);
    case 'ocnt':{const n=S.cmd.length;return n?' ('+n+(S.cmd.some(canDeliver)?' ✓':'')+')':'';}
    case 'ot':{const o=S.cmd.find(x=>String(x.uid)===a);return o?fmtT(o.t):'';}
    case 'oh':{const [u,i]=a.split('|');const o=S.cmd.find(x=>String(x.uid)===u);return o?String(stockOf(o.lines[+i].id,o.lines[+i].r)):'';}
    case 'kt':{const c=S.con[a],k=KMAP[a];if(!c)return '';if(!c.on)return 'En pause';return stockOf(k.item,0)>0?'Prochaine livraison dans '+fmtT(k.every-c.t):'En attente de stock';}
    case 'kg':return S.con[a]?fmt(S.con[a].g||0):'';
    case 'cnt':return String(S.stock[a]||0);
    case 'oq':{const o=S.orders.find(x=>x.id===a);return !o?'':o.n<0?'∞ en continu':'× '+o.n+' à lancer';}
    case 'zhp':return fmt(Math.max(0,Math.ceil(S.hp)))+' / '+fmt(ZMAP[S.zone].hp);
    case 'tapd':return fmtd(tapDmg());
    case 'dpsv':return fmtd(dps());
    case 'prog':return Math.min(100,Math.floor(S.run/1e4))+' %';
    case 'slt':{const s=S.slots[+a];if(!s)return '';if(s.on)return fmtT((IMAP[s.r].t-s.p)/speed());return S.orders.length?'En attente de matériaux':'Prête';}
  }
  return '';
}
function wval(k){
  const [t,a]=split(k);
  switch(t){
    case 'hp':return S.hp/ZMAP[S.zone].hp;
    case 'rank':return rankInfo().f;
    case 'slot':{const s=S.slots[+a];return s&&s.on?s.p/IMAP[s.r].t:0;}
    case 'ev':return S.evT/60;
    case 'q':{const q=QUESTS[S.q];return q?q.v()/q.n:1;}
    case 'ot':{const o=S.cmd.find(x=>String(x.uid)===a);return o?o.t/o.tmax:0;}
    case 'kt':{const c=S.con[a];return c?c.t/KMAP[a].every:0;}
    case 'prog':return S.run/1e6;
  }
  return 0;
}
function affOK(k){
  const [t,a]=split(k);
  if(t==='up'){const u=UMAP[a];return S.gold>=upCost(u)&&(!u.mat||(S.mats[u.mat.m]||0)>=upMat(u));}
  if(t==='zone')return S.gold>=ZMAP[a].cost;
  if(t==='ord'){const o=S.cmd.find(x=>String(x.uid)===a);return !!o&&canDeliver(o);}
  if(t==='con')return S.gold>=KMAP[a].cost&&S.rep>=KMAP[a].rep;
  if(t==='rec')return hasMats(costOf(IMAP[a]));
  return true;
}
function updateBindings(){
  document.querySelectorAll('[data-b]').forEach(el=>{const v=bval(el.dataset.b);if(el.textContent!==v)el.textContent=v;});
  document.querySelectorAll('[data-w]').forEach(el=>{el.style.width=Math.max(0,Math.min(1,wval(el.dataset.w)))*100+'%';});
  document.querySelectorAll('[data-hc]').forEach(el=>{el.style.width=(1-Math.max(0,Math.min(1,wval(el.dataset.hc))))*100+'%';});
  document.querySelectorAll('[data-aff]').forEach(el=>{el.classList.toggle('no',!affOK(el.dataset.aff));});
  document.querySelectorAll('[data-need]').forEach(el=>{const [m,q]=el.dataset.need.split(':');el.classList.toggle('lack',(S.mats[m]||0)<+q);});
  document.querySelectorAll('[data-hv]').forEach(el=>{const [u,i]=el.dataset.hv.split('|');const o=S.cmd.find(x=>String(x.uid)===u);if(o){const l=o.lines[+i];el.classList.toggle('lack',stockOf(l.id,l.r)<l.n);}});
  document.querySelectorAll('[data-tone]').forEach(el=>{const id=el.dataset.tone.split(':')[1];const v=getDem(id)*evMult(IMAP[id]);el.classList.toggle('up',v>1.02);el.classList.toggle('down',v<.98);});
}
function updateTop(){
  const ev=$('#ev');
  if(S.ev){ ev.hidden=false; $('#evN').textContent=EV[S.ev].n; $('#evD').textContent=EV[S.ev].d; } else ev.hidden=true;
  const q=QUESTS[S.q],box=$('#quest');
  if(!q){ box.hidden=true; return; }
  box.hidden=false; const done=q.v()>=q.n;
  $('#qT').textContent=q.t+(q.n>1&&!done?' ('+fmt(Math.min(q.v(),q.n))+' / '+fmt(q.n)+')':'');
  const b=$('#qB'); b.hidden=!done; b.textContent=q.r?'Réclamer '+fmt(q.r)+' or':'Terminer';
}

/* ---------- render loop ---------- */
function render(){
  ensureSlots(); renderMats(); renderItems();
  if(TAB==='mine'){ renderArena(); renderZones(); }
  else if(TAB==='forge') renderForge();
  else if(TAB==='shop') renderShop();
  else if(TAB==='up') renderUp();
  else if(TAB==='emp') renderEmp();
  updateTop(); updateBindings();
}
function showTab(t){
  TAB=t;
  for(const id of ['mine','forge','shop','up','emp']) $('#tab-'+id).hidden=id!==t;
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===t));
  window.scrollTo(0,0); render();
}

/* ---------- actions ---------- */
function act(a,id){
  switch(a){
    case 'tab':showTab(id);return;
    case 'sv':SHOPV=id;break;
    case 'ordok':{
      const o=S.cmd.find(x=>String(x.uid)===id); if(!o) return;
      if(!canDeliver(o)){toast('Il te manque des objets (qualité minimale comprise).');return;}
      o.lines.forEach(l=>takeItems(l.id,l.r,l.n)); gain(o.gold); S.rep+=o.rep; S.st.orders=(S.st.orders||0)+1;
      S.cmd=S.cmd.filter(x=>x!==o); snd('coin'); toast(o.who+' paie '+fmt(o.gold)+' or. +'+o.rep+' réputation.'); break;}
    case 'ordno':S.cmd=S.cmd.filter(x=>String(x.uid)!==id);break;
    case 'conbuy':{
      const k=KMAP[id]; if(S.con[id]) return;
      if(S.rep<k.rep){toast('Réputation '+k.rep+' requise.');return;}
      if(S.gold<k.cost){toast('Il te faut '+fmt(k.cost)+' or.');return;}
      S.gold-=k.cost; S.con[id]={on:true,t:0,g:0}; snd('buy'); toast('Contrat signé : '+k.n+'.'); break;}
    case 'contog':{const c=S.con[id];if(c)c.on=!c.on;break;}
    case 'zsel':if(S.zu[id]&&S.zone!==id){S.zone=id;S.hp=ZMAP[id].hp;lastZone=null;}break;
    case 'zbuy':{const z=ZMAP[id];if(S.gold<z.cost){toast('Il te faut '+fmt(z.cost)+' or.');return;}S.gold-=z.cost;snd('buy');S.zu[id]=1;S.zone=id;S.hp=z.hp;lastZone=null;toast(z.n+' est ouvert.');break;}
    case 'rec':addOrder(id);break;
    case 'qm':{const q=S.qsel[id]||1;S.qsel[id]=q<0?1:Math.max(1,q-1);break;}
    case 'qp':{const q=S.qsel[id]||1;S.qsel[id]=q<0?1:Math.min(99,q+1);break;}
    case 'qset':{const [i,v]=id.split('|');S.qsel[i]=+v;break;}
    case 'ocancel':S.orders=S.orders.filter(o=>o.id!==id);break;
    case 'scancel':{const s=S.slots[+id];if(s&&s.on){const c=costOf(IMAP[s.r]);for(const m in c)S.mats[m]=(S.mats[m]||0)+c[m];s.on=false;s.p=0;s.r=null;}break;}
    case 'sell1':if(sellOne(id))snd('coin');break;
    case 'sellk':{const c=S.stock[id]||0;for(let i=0;i<c;i++)sellOne(id);if(c)snd('coin');break;}
    case 'sellall':{const [t,n]=sellAll();if(n)snd('coin');if(n)toast(n+' objet'+(n>1?'s':'')+' vendu'+(n>1?'s':'')+' pour '+fmt(t)+' or.');break;}
    case 'sellcommon':{const [t,n]=sellAll(k=>k.endsWith('|0'));if(n)snd('coin');if(n)toast(n+' objet'+(n>1?'s':'')+' vendu'+(n>1?'s':'')+' pour '+fmt(t)+' or.');break;}
    case 'up':{
      const u=UMAP[id];if(u.max&&lvl(id)>=u.max)return;
      const c=upCost(u),mc=upMat(u);
      if(S.gold<c){toast('Il te faut '+fmt(c)+' or.');return;}
      if(u.mat&&(S.mats[u.mat.m]||0)<mc){toast('Il te faut '+fmt(mc)+' '+MATS[u.mat.m].n+'.');return;}
      S.gold-=c;if(u.mat)S.mats[u.mat.m]-=mc;S.up[id]=lvl(id)+1;snd('buy');break;}
    case 'claim':{const q=QUESTS[S.q];if(q&&q.v()>=q.n){S.gold+=q.r;S.q++;snd('buy');toast(q.r?'Objectif accompli : +'+fmt(q.r)+' or.':'Objectif accompli.');}break;}
    case 'prestige':
      if(!confP){confP=true;clearTimeout(act.pt);act.pt=setTimeout(()=>{confP=false;render();},5000);}
      else{const g=legGain();if(g>=1){S=Object.assign(fresh(),{legacy:S.legacy+g,life:S.life,q:S.q,st:S.st,rep:S.rep});lastZone=null;confP=false;save();toast('Ton héritier reprend la forge. Légende '+S.legacy+'.');}}
      break;
    case 'reset':
      if(!confR){confR=true;clearTimeout(act.rt);act.rt=setTimeout(()=>{confR=false;render();},5000);}
      else{S=fresh();lastZone=null;confR=false;save();toast('Nouvelle partie.');}
      break;
  }
  render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(el) act(el.dataset.a,el.dataset.id);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.zone[data-a]')){e.preventDefault();act(e.target.dataset.a,e.target.dataset.id);}
});
const strikeBtn=$('#strike'),hamBtn=$('#hammer');
strikeBtn.addEventListener('pointerdown',e=>{e.preventDefault();strike(e);updateBindings();});
strikeBtn.addEventListener('click',e=>{if(e.detail===0){strike(e);updateBindings();}});
hamBtn.addEventListener('pointerdown',e=>{e.preventDefault();hammer();updateBindings();});
hamBtn.addEventListener('click',e=>{if(e.detail===0){hammer();updateBindings();}});

const sb=$('#snd');
function sndBtn(){
  sb.setAttribute('aria-pressed',String(SND.on)); sb.className=SND.on?'':'off';
  sb.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor" stroke="none"/>'+(SND.on?'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M16 9l5 6M21 9l-5 6"/>')+'</svg>';
}
sb.addEventListener('click',()=>{ SND.on=!SND.on; try{localStorage.setItem('eb-snd',SND.on?'1':'0');}catch(e){} sndBtn(); if(SND.on) snd('buy'); });
sndBtn();
const mb=$('#mus');
function musBtn(){
  mb.setAttribute('aria-pressed',String(MUS.on)); mb.className=MUS.on?'':'off';
  mb.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/>'+(MUS.on?'':'<path d="M3 3l18 18"/>')+'</svg>';
}
mb.addEventListener('click',()=>{ MUS.on=!MUS.on; try{localStorage.setItem('eb-mus',MUS.on?'1':'0');}catch(e){} musBtn(); if(MUS.on) startMusic(); else stopMusic(); });
musBtn();
function unlock(){ if(MUS.on||SND.on) ensureCtx(); if(MUS.on&&!MUS.run) startMusic(); }
['pointerdown','pointerup','click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
document.addEventListener('visibilitychange',()=>{ const c=SND.ctx; if(!c) return; try{ if(document.hidden) c.suspend(); else c.resume(); }catch(e){} });

/* ---------- boot ---------- */
load();
let last=Date.now();
{ const dt=Math.min((Date.now()-S.t)/1000,14400); if(dt>60) advance(dt); }
render();
setInterval(()=>{ const now=Date.now(); let dt=(now-last)/1000; last=now; if(dt<0)dt=0; advance(Math.min(dt,14400)); render(); },200);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
window.addEventListener('pagehide',save);
window.__game={S:()=>S,advance,act,render,snd,mkOrder,startMusic,MUS};
})();
</script>
